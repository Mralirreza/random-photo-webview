<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Random Photos</title>

<style>
@font-face{
    font-family:'Peyda';
    src:url('Peyda-Bold.ttf') format('truetype');
}

body{
    margin:0;
    background:black;
    text-align:center;
    font-family:'Peyda',sans-serif;
}

#photo{
    width:100%;
    max-height:75vh;
    object-fit:contain;
    margin-top:10px;
}

#photoDate{
    color:white;
    font-size:24px;
    margin-top:15px;
    margin-bottom:15px;
}

.buttons{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:15px;
    margin:20px auto;
}

button{
    width:180px;
    min-height:120px;
    background:#E8C6F0;
    color:#000;
    border:none;
    border-radius:28px;
    font-size:20px;
    font-family:'Peyda',sans-serif;
    cursor:pointer;
}

button:hover{
    transform:translateY(-5px);
}
</style>
</head>

<body>

<img id="photo">
<div id="photoDate"></div>

<div class="buttons">
    <button onclick="showRandomPhoto()">📷<br>عکس تصادفی</button>
    <button onclick="showPreviousPhoto()">⬅️<br>عکس قبلی</button>
    <button onclick="showNextPhoto()">➡️<br>عکس بعدی</button>
</div>

<script>
const photos = [
    { image:"images/photo1.jpg", date:"1403/01/15" },
    { image:"images/photo2.jpg", date:"1403/02/10" },
    { image:"images/photo3.jpg", date:"1403/03/20" },
    { image:"images/photo4.jpg", date:"1403/04/05" },
    { image:"images/photo5.jpg", date:"1403/05/18" }
];

let history = [];
let currentIndex = -1;

function displayPhoto(photo){
    document.getElementById("photo").src = photo.image;
    document.getElementById("photoDate").innerText = "📅 " + photo.date;
}

function showRandomPhoto(){
    const randomPhoto = photos[Math.floor(Math.random() * photos.length)];

    if(currentIndex < history.length - 1){
        history = history.slice(0, currentIndex + 1);
    }

    history.push(randomPhoto);
    currentIndex++;
    displayPhoto(randomPhoto);
}

function showPreviousPhoto(){
    if(currentIndex > 0){
        currentIndex--;
        displayPhoto(history[currentIndex]);
    }
}

function showNextPhoto(){
    if(currentIndex < history.length - 1){
        currentIndex++;
        displayPhoto(history[currentIndex]);
    }
}

showRandomPhoto();
</script>

</body>
</html>
