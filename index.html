<!DOCTYPE html>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Gallery</title>

<style>
@font-face{
    font-family:'Peyda';
    src:url('Peyda-Bold.ttf') format('truetype');
}

body{
    margin:0;
    background:black;
    text-align:center;
    font-family:'Peyda',sans-serif;
}

#photo{
    width:100%;
    max-height:75vh;
    object-fit:contain;
    margin-top:10px;
}

#photoDate{
    color:white;
    font-size:24px;
    margin:15px 0;
}

.buttons{
    display:flex;
    justify-content:center;
    gap:15px;
    margin:20px auto;
}

.nav-btn{
    width:180px;
    min-height:80px;
    background:#E8C6F0;
    color:#000;
    border:none;
    border-radius:28px;
    font-size:20px;
    font-family:'Peyda',sans-serif;
    cursor:pointer;
}

#commentInput{
    width:90%;
    max-width:500px;
    height:90px;
    padding:10px;
    border-radius:15px;
    font-family:'Peyda',sans-serif;
    resize:none;
}

.save-btn{
    margin-top:10px;
    padding:12px 24px;
    border:none;
    border-radius:15px;
    background:#E8C6F0;
    font-family:'Peyda',sans-serif;
    cursor:pointer;
}

#comments{
    width:90%;
    max-width:500px;
    margin:20px auto;
    text-align:right;
    color:white;
}

.comment{
    background:#222;
    padding:12px;
    border-radius:12px;
    margin-top:10px;
    word-break:break-word;
}
</style>
</head>
