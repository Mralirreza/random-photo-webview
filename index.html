<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Random Photo Viewer v2.0</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <header>

            <h1>📷 گالری تصاویر</h1>

        </header>

        <main>

            <section class="photo-section">

                <img
                    id="photo"
                    src=""
                    alt="Photo">

                <div id="photoDate"></div>

                <div class="navigation">

                    <button id="previousButton">

                        ⬅ قبلی

                    </button>

                    <button id="nextButton">

                        بعدی ➜

                    </button>

                </div>

            </section>

            <section class="comment-section">

                <h2>

                    💬 کامنت‌ها

                </h2>

                <div id="comments">

                    در حال بارگذاری...

                </div>

                <textarea

                    id="commentInput"

                    placeholder="نظر خود را بنویس..."

                ></textarea>

                <button id="sendComment">

                    ثبت کامنت

                </button>

            </section>

        </main>

        <footer>

            <button id="adminLogin">

                ورود مدیر

            </button>

        </footer>

    </div>

    <script type="module" src="firebase.js"></script>

    <script type="module" src="app.js"></script>

</body>

</html>
