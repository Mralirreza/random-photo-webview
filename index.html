<!DOCTYPE html>
<html lang="fa">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Random Photos</title>

<style>

@font-face {
    font-family: 'Peyda';
    src: url('Peyda-Bold.ttf') format('truetype');
    font-weight: bold;
    font-style: normal;
}

body{
    margin:0;
    background:black;
    text-align:center;
    font-family:'Peyda', sans-serif;
}

#photo{
    width:100%;
    max-height:75vh;
    object-fit:contain;
    margin-top:10px;
}

.buttons{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:15px;
    width:95%;
    max-width:750px;
    margin:20px auto;
}

button{
    background:#E8C6F0;
    color:#000;
    border:none;
    border-radius:28px;
    min-height:120px;
    font-size:20px;
    font-weight:bold;
    font-family:'Peyda', sans-serif;
    cursor:pointer;
    box-shadow:0 8px 20px rgba(0,0,0,0.25);
    transition:0.3s;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    padding:15px;
}

button:hover{
    transform:translateY(-5px) scale(1.03);
}

button:active{
    transform:scale(0.98);
}

.icon{
    font-size:40px;
    margin-bottom:10px;
}

@media(max-width:600px){

    .buttons{
        grid-template-columns:1fr;
    }

    button{
        min-height:100px;
    }
}

</style>

</head>

<body>

<img id="photo">

<div class="buttons">

    <button onclick="showRandomPhoto()">
        <div class="icon">📷</div>
        عکس تصادفی جدید
    </button>

    <button onclick="showPreviousPhoto()">
        <div class="icon">⬅️</div>
        عکس قبلی
    </button>

    <button onclick="showNextPhoto()">
        <div class="icon">➡️</div>
        عکس بعدی
    </button>

</div>

<script>

const photos = [
    "images/photo1.jpg",
    "images/photo2.jpg",
    "images/photo3.jpg",
    "images/photo4.jpg",
    "images/photo5.jpg"
];

let history = [];
let currentIndex = -1;

function showRandomPhoto() {

    const randomPhoto =
        photos[Math.floor(Math.random() * photos.length)];

    if (currentIndex < history.length - 1) {
        history = history.slice(0, currentIndex + 1);
    }

    history.push(randomPhoto);
    currentIndex++;

    document.getElementById("photo").src = randomPhoto;
}

function showPreviousPhoto() {

    if (currentIndex > 0) {

        currentIndex--;

        document.getElementById("photo").src =
            history[currentIndex];
    }
}

function showNextPhoto() {

    if (currentIndex < history.length - 1) {

        currentIndex++;

        document.getElementById("photo").src =
            history[currentIndex];
    }
}

showRandomPhoto();

</script>

</body>
</html>
