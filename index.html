                                                    <!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Gallery</title>

<style>
@font-face{
    font-family:'Peyda';
    src:url('Peyda-Bold.ttf') format('truetype');
}

body{
    margin:0;
    background:black;
    text-align:center;
    font-family:'Peyda',sans-serif;
}

#photo{
    width:100%;
    max-height:75vh;
    object-fit:contain;
    margin-top:10px;
}

#photoDate{
    color:white;
    font-size:24px;
    margin:15px 0;
}

.buttons{
    display:flex;
    justify-content:center;
    gap:15px;
    margin:20px auto;
}

.nav-btn{
    width:180px;
    min-height:80px;
    background:#E8C6F0;
    color:#000;
    border:none;
    border-radius:28px;
    font-size:20px;
    font-family:'Peyda',sans-serif;
    cursor:pointer;
}

#commentInput{
    width:90%;
    max-width:500px;
    height:90px;
    padding:10px;
    border-radius:15px;
    font-family:'Peyda',sans-serif;
    resize:none;
}

.save-btn{
    margin-top:10px;
    padding:12px 24px;
    border:none;
    border-radius:15px;
    background:#E8C6F0;
    font-family:'Peyda',sans-serif;
    cursor:pointer;
}

#comments{
    width:90%;
    max-width:500px;
    margin:20px auto;
    text-align:right;
    color:white;
}

.comment{
    background:#222;
    padding:12px;
    border-radius:12px;
    margin-top:10px;
    word-break:break-word;
}
</style>
</head>

<body>

<img id="photo">
<div id="photoDate"></div>

<textarea id="commentInput" placeholder="کامنت خود را بنويسيد..."></textarea>
<br>
<button class="save-btn" onclick="saveComment()">ثبت کامنت</button>

<div id="comments"></div>

<div class="buttons">
    <button class="nav-btn" onclick="showPreviousPhoto()">⬅️<br>عکس قبلي</button>
    <button class="nav-btn" onclick="showNextPhoto()">➡️<br>عکس بعدي</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
  getFirestore,
  collection,
  addDoc,
  query,
  where,
  onSnapshot,
  serverTimestamp,
  deleteDoc,
  doc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  const firebaseConfig = {
  apiKey: "AIzaSyCvcRGbuSMPcE4vXpewgdmP37LfvChIfXQ",
  authDomain: "random-photo-alireza.firebaseapp.com",
  projectId: "random-photo-alireza",
  storageBucket: "random-photo-alireza.firebasestorage.app",
  messagingSenderId: "233987316766",
  appId: "1:233987316766:web:95b51081a120d49ffee20f",
  measurementId: "G-9MHWL76RFE"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
let photos = [];
let currentIndex = 0;
let unsubscribe = null;

async function loadPhotos() {

    try {

        const response = await fetch("photos.json");

        photos = await response.json();

        displayPhoto();

    } catch (error) {

        console.error(error);

        alert("خطا در خواندن photos.json");

    }

}

function getPhotoKey(){
    return photos[currentIndex].image;
}

function loadComments(){

    const key = getPhotoKey();

    const comments =
        JSON.parse(localStorage.getItem(key)) || [];

    let html = "<h3>💬 کامنت‌ها</h3>";

    comments.forEach(comment => {
        html += `<div class="comment">${comment}</div>`;
    });

    document.getElementById("comments").innerHTML = html;
}

window.saveComment = function(){

    const input =
        document.getElementById("commentInput");

    const text = input.value.trim();

    if(!text) return;

    const key = getPhotoKey();

    const comments =
        JSON.parse(localStorage.getItem(key)) || [];

    comments.push(text);

    localStorage.setItem(
        key,
        JSON.stringify(comments)
    );

    input.value = "";

    loadComments();
}

function displayPhoto(){

    document.getElementById("photo").src =
        photos[currentIndex].image;

    document.getElementById("photoDate").innerText =
        "?? " + photos[currentIndex].date;

    loadComments();
}

window.showNextPhoto = function(){

    if(currentIndex < photos.length - 1){

        currentIndex++;

        displayPhoto();
    }
}

window.showPreviousPhoto = function(){

    if(currentIndex > 0){

        currentIndex--;

        loadPhotos();
    }
}

displayPhoto();

</script>

</body>
</html>
