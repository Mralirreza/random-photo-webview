<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Random Image</title>

<style>
body{
    margin:0;
    background:black;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

img{
    max-width:100%;
    max-height:100%;
}
</style>

</head>
<body>

<img id="img">

<script>
const photos = [
    "images/photo1.jpg",
    "images/photo2.jpg",
    "images/photo3.jpg",
    "images/photo4.jpg"
];

const randomPhoto =
    photos[Math.floor(Math.random()*photos.length)];

document.getElementById("img").src = randomPhoto;
</script>

</body>
</html>
