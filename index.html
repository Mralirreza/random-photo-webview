<!DOCTYPE html>
<html lang="fa">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Random Photos</title>

<style>

body{
    margin:0;
    background:black;
    text-align:center;
}

#photo{
    width:100%;
    max-height:85vh;
    object-fit:contain;
    margin-top:10px;
}

button{
    padding:12px 25px;
    margin:8px;
    font-size:18px;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

</style>

</head>

<body>

<img id="photo">

<br>

<button onclick="showRandomPhoto()">
🎲 عکس تصادفی جدید
</button>

<button onclick="showPreviousPhoto()">
⬅️ عکس قبلی
</button>

<script>

const photos = [
    "images/photo1.jpg",
    "images/photo2.jpg",
    "images/photo3.jpg",
    "images/photo4.jpg",
    "images/photo5.jpg"
];

let currentPhoto = null;
let previousPhoto = null;

function showRandomPhoto(){

    previousPhoto = currentPhoto;

    const randomIndex =
        Math.floor(Math.random() * photos.length);

    currentPhoto = photos[randomIndex];

    document.getElementById("photo").src =
        currentPhoto;
}

function showPreviousPhoto(){

    if(previousPhoto){

        document.getElementById("photo").src =
            previousPhoto;
    }
}

showRandomPhoto();

</script>

</body>
</html>
