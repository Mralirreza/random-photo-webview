<!DOCTYPE html>
<html lang="fa">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Random Photos</title>

<style>

body{
    margin:0;
    background:black;
    text-align:center;
    font-family:tahoma;
}

#photo{
    width:100%;
    max-height:75vh;
    object-fit:contain;
    margin-top:10px;
}

.buttons{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:20px;

    width:90%;
    max-width:500px;

    margin:20px auto;
}

button{
    background:#E8C6F0;
    color:#000;

    border:none;
    border-radius:28px;

    min-height:120px;

    font-size:22px;
    font-weight:bold;

    cursor:pointer;

    box-shadow:
        0 8px 20px rgba(0,0,0,0.25);

    transition:0.3s;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    padding:15px;
}

button:hover{
    transform:translateY(-5px) scale(1.03);
}

button:active{
    transform:scale(0.98);
}

.icon{
    font-size:40px;
    margin-bottom:10px;
}

</style>

</head>

<body>

<img id="photo">

<div class="buttons">

    <button onclick="showRandomPhoto()">
        <div class="icon">📷</div>
        عکس تصادفی جدید
    </button>

    <button onclick="showPreviousPhoto()">
        <div class="icon">↩️</div>
        عکس قبلی
    </button>

</div>

<script>

const photos = [
    "images/photo1.jpg",
    "images/photo2.jpg",
    "images/photo3.jpg",
    "images/photo4.jpg",
    "images/photo5.jpg"
];

let currentPhoto = null;
let previousPhoto = null;

function showRandomPhoto(){

    previousPhoto = currentPhoto;

    const randomIndex =
        Math.floor(Math.random() * photos.length);

    currentPhoto = photos[randomIndex];

    document.getElementById("photo").src =
        currentPhoto;
}

function showPreviousPhoto(){

    if(previousPhoto){

        document.getElementById("photo").src =
            previousPhoto;
    }
}

showRandomPhoto();

</script>

</body>
</html>
